name: ProblemChain Full-Stack CI

on:
  push:
    branches: [ main, Test ]
  pull_request:
    branches: [ main, Test ]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Typecheck & Lint Gate
        run: npm run lint

      - name: Production Bundle Build Gate
        run: npm run build
